
<!DOCTYPE html>
<html>
<head>
    <title>FoodExpress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>🍔 FoodExpress</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#cart">Cart</a>
        </nav>
    </header>

    <!-- Home Section -->
    <section class="hero" id="home">
        <h2>Delicious Food Delivered Fast!</h2>
        <p>Order your favourite food online.</p>
        <a href="#menu" class="order-btn">Order Now</a>
    </section>

    <!-- Search -->
    <section class="menu-section" id="menu">

        <h2>Our Food Menu</h2>

        <input type="text" id="search"
        placeholder="Search food...">

        <div class="food-container" id="food-list">

            <!-- Food items added using JavaScript -->

        </div>

    </section>

    <!-- Cart Section -->
    <section class="cart-section" id="cart">

        <h2>🛒 Your Shopping Cart</h2>

        <div id="cart-items">
            Your cart is empty.
        </div>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button onclick="placeOrder()">
            Place Order
        </button>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 FoodExpress. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
